name: CI

on:
  push:
    branches:
      - main
      - chore/testing-ci-documentation
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Typecheck, Build, and Unit Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://supportdesk_user:supportdesk_password@localhost:5432/supportdesk_pro?schema=public

      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: supportdesk_pro
      POSTGRES_USER: supportdesk_user
      POSTGRES_PASSWORD: supportdesk_password

      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379

      MONGO_URL: mongodb://localhost:27017/supportdesk_pro_activity
      MONGO_DB_NAME: supportdesk_pro_activity

      ACCESS_TOKEN_SECRET: 1234567890123456789012345678901234567890123456789012345678901234
      ACCESS_TOKEN_EXPIRES_IN_SECONDS: 900
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 7

      GOOGLE_OAUTH_CLIENT_ID: ''
      GOOGLE_OAUTH_CLIENT_SECRET: ''
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:5000/auth/google/callback
      OAUTH_STATE_SECRET: abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd

      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_BYTES: 5242880

      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_S3_BUCKET: ''
      S3_PRESIGNED_URL_EXPIRES_IN_SECONDS: 300

      AWS_DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_DYNAMODB_NOTIFICATION_EVENTS_TABLE: supportdesk_notification_events

      CACHE_TTL_SECONDS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 1000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit
